<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101c33">
  <meta name="description" content="Spot, recognize, and care for the neighborhood animals together.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <title>Pawtrol · Every stray has a story</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Pawtrol home"><span class="brand-mark">✦</span> pawtrol<span class="brand-dot">.</span></a>
      <span class="community-pill"><span class="pulse"></span> COMMUNITY LIVE</span>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-nav="home" class="nav-active"><span class="nav-icon">⌂</span><small>Home</small></button>
      <button data-nav="explore"><span class="nav-icon">◉</span><small>Explore</small></button>
      <button data-nav="scan" class="scan-tab" aria-label="Scan a stray"><span>＋</span></button>
      <button data-nav="activity"><span class="nav-icon">♡</span><small>Care log</small></button>
      <button data-nav="about"><span class="nav-icon">⋯</span><small>About</small></button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
  <script src="/features.js" defer></script>
</body>
</html>
